site_name: ADB Helper
site_description: An Android app that turns a phone into an ADB control console for a second Android device.
repo_url: https://github.com/didjdk/adbhelper
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Features:
      - Overview: features/index.md
      - Connect: features/connect.md
      - Device hub: features/hub.md
      - Info: features/info.md
      - Apps: features/apps.md
      - Files: features/files.md
      - Shell: features/shell.md
      - Processes: features/processes.md
      - Logs: features/logs.md
      - Power: features/power.md
      - Monitor: features/monitor.md
      - Mirror: features/mirror.md
      - Identity and layout: features/platform.md
  - Architecture: architecture.md
  - Testing: testing.md
  - Known limitations: known-limitations.md
  - Third-party notices: third-party.md
  - Contributing: contributing.md
