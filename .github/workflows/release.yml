name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build docs site
        run: |
          pip install mkdocs-material
          mkdocs build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build unsigned release APK
        run: >
          bash ./gradlew assembleRelease
          -PversionName=${GITHUB_REF_NAME#v}
          -PversionCode=${{ github.run_number }}

      - name: Sign APK with signapp
        run: |
          pip install signapp
          # signapp shells out to zipalign and apksigner: use the runner's SDK build-tools
          export PATH="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1):$PATH"
          mkdir -p ~/.reltools
          unsigned=$(ls app/build/outputs/apk/release/*.apk)
          # no -k: signapp signs with its built-in keystore
          signapp -a "$unsigned" -o "adbhelper-${GITHUB_REF_NAME}.apk"
          apksigner verify --verbose "adbhelper-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: adbhelper-apk
          path: adbhelper-*.apk
          if-no-files-found: error

  # Runs only when a release is drafted (tag v*), never on branch pushes or pull requests.
  # continue-on-error and no `needs` link: a failure here is reported but does not block the
  # release; add it to the release job's `needs` once it has been stable for a while.
  emulator-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Hardware acceleration for the emulator: let the runner user open /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Writes the integration test's public key (adb_keys line format) to a file. The key pair
      # itself is created in ~/.adbhelper-test/ exactly as RealAdbdIntegrationTest loads it.
      - name: Export the integration-test public key
        run: ADBHELPER_EXPORT_PUBKEY="$PWD/test-adbkey.pub" bash ./gradlew :app:testDebugUnitTest --tests '*ExportTestAdbKeyTest*'

      # Authorises that key, opens adbd on TCP, then runs the integration and instrumented tests.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: bash ./.github/scripts/emulator-tests.sh

  release:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" assets/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
